name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loans_test
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/loans_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Create test environment file
        run: echo "TEST_DATABASE_URL=${{ env.TEST_DATABASE_URL }}" > .env.local

      - name: Create schema
        run: node -e "process.env.DATABASE_URL=process.env.TEST_DATABASE_URL; require('./db/migrate').runSchema().then(()=>process.exit(0))"

      - run: npm test